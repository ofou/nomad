services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: work-holiday-backend
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - backend_node_modules:/app/node_modules
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PORT=5001
    restart: unless-stopped
    networks:
      - work-holiday-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: work-holiday-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:5001
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=false
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - work-holiday-network
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  backend_node_modules:
  frontend_node_modules:

networks:
  work-holiday-network:
    driver: bridge